<section class="min-h-screen bg-slate-950 text-white flex items-center justify-center px-6">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-10">
  
      <h1 class="text-4xl font-bold mb-3">
        Contact Us
      </h1>
  
      <p class="text-slate-400 mb-8">
        Send us a message and we’ll get back to you soon.
      </p>
  
      <form class="space-y-6">
  
        <div>
          <label class="block mb-2 text-sm text-slate-300">
            Name
          </label>
  
          <input
            type="text"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-sky-500"
            placeholder="Your name"
          >
        </div>
  
        <div>
          <label class="block mb-2 text-sm text-slate-300">
            Email
          </label>
  
          <input
            type="email"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-sky-500"
            placeholder="you@example.com"
          >
        </div>
  
        <div>
          <label class="block mb-2 text-sm text-slate-300">
            Message
          </label>
  
          <textarea
            rows="5"
            class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-sky-500"
            placeholder="Your message..."
          ></textarea>
        </div>
  
        <button
          type="submit"
          class="w-full py-3 rounded-xl bg-sky-500 hover:bg-sky-600 transition font-semibold"
        >
          Send Message
        </button>
  
      </form>
  
    </div>
  
  </section>
